<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OC Form 解析</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>OC Form 解析</h1>
    <span class="badge">MVP 1：動画の読み込み・再生</span>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>動画</h2>
      <div class="row">
        <button class="tab" data-view="front">前</button>
        <button class="tab" data-view="left">左</button>
        <button class="tab" data-view="right">右</button>
        <button class="tab" data-view="back">後ろ</button>
      </div>
      <div class="row">
        <label class="btn">
          動画を選択
          <input type="file" id="fileInput" accept="video/*" hidden>
        </label>
        <span id="fileName" class="muted">未選択</span>
      </div>
      <video id="video" playsinline></video>
      <p id="emptyNote" class="muted">方向を選んでから動画を選択してください。動画はこのPC内でのみ処理され、外部に送信されません。</p>
    </section>

    <section class="panel">
      <h2>再生操作</h2>
      <input type="range" id="seek" min="0" max="0" value="0">
      <div class="row">
        <button class="btn" id="prev">◀ 1コマ</button>
        <button class="btn" id="play">▶ 再生</button>
        <button class="btn" id="next">1コマ ▶</button>
        <select id="speed" class="btn">
          <option value="0.25">0.25倍</option>
          <option value="0.5">0.5倍</option>
          <option value="1" selected>1倍</option>
          <option value="2">2倍</option>
        </select>
      </div>
      <p class="muted">キー操作：スペース＝再生/停止、← →＝コマ送り</p>

      <dl class="info">
        <dt>時間</dt><dd id="time">--</dd>
        <dt>フレーム（推定）</dt><dd id="frame">--</dd>
        <dt>長さ</dt><dd id="duration">--</dd>
        <dt>解像度</dt><dd id="resolution">--</dd>
        <dt>fps（手入力）</dt><dd><input type="number" id="fps" value="60" min="1" max="240"></dd>
      </dl>
      <p class="muted">ブラウザは動画のfpsを読み取れないため、撮影時の値を入力してください。フレーム番号はこの値からの推定です。</p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
