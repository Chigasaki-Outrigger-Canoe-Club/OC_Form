# Cloudflare Worker の設定（GitHub と連携して自動で作り直すときに使う）
# Cloudflare の画面「Workers & Pages → Create → Import a repository」で OC_Form を選び、
# ルートのフォルダ（Root directory / Path）に tools/r2-worker を指定する
name = "oc-form-video"
main = "worker.js"
compatibility_date = "2026-10-01"

# 動画の保存場所（R2 のバケット）を VIDEOS という名前で結び付ける
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "oc-form-videos"

# 合言葉（UPLOAD_KEY・VIEW_KEY）はここに書かない。Cloudflare の画面の「Variables and Secrets」で Secret として入れる
